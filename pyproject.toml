[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "small-cap-stack"
version = "0.0.1"
description = "Automated systematic trading system for US small-cap momentum (Warrior-style), via IBKR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ib-async>=2.0.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # Not imported here — pydantic-settings requires it unconditionally. Declared anyway because
    # `config.py` uses `env_file=".env"`, which is the feature that needs it: if pydantic-settings
    # ever made it optional, `Settings()` would start raising at import with no other warning.
    "python-dotenv>=1.0",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "duckdb>=1.1",
    "exchange-calendars>=4.10",
    "polars>=1.0",
    # ⚠️ KEEP, despite no `import pyarrow` anywhere. `storage.py` bridges DuckDB to polars with
    # `.pl()`, which goes through Arrow and hard-requires it — and NOTHING pulls it in for us:
    # duckdb declares it only under `extra == "all"`, polars only under `extra == "pyarrow"`.
    # Dropping it as "unused" breaks every store read (#521).
    "pyarrow>=25.0.1",
    "yfinance>=0.2.40",
    "prometheus-client>=0.20",
]

[project.scripts]
small-cap-stack = "small_cap_stack.app:run_sync"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    # The deploy path is ~1.9k lines of shell and YAML that had zero static analysis while the
    # Python got mypy --strict (#548). Both of these ship the real binary in a wheel, so they are
    # in the lock like everything else — CI and `make check` run one recorded version, not
    # whatever the runner image happens to carry. actionlint also runs shellcheck over `run:`
    # blocks when it finds it on PATH, which is how it caught the argument-injection in the
    # backfill dispatch.
    "shellcheck-py>=0.11",
    "actionlint-py>=1.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/small_cap_stack"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff 0.16 started formatting Python code blocks inside Markdown, which reflows the
# hand-aligned comment columns the `research/` specs use to stay readable (and turned
# `ruff format --check .` red on docs no CI job has any business rewriting). `ruff>=0.8`
# is unpinned, so this is opt-out, not a version pin: the formatter owns .py only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ARG (#519): an unused parameter is a lie about what a function depends on, and callers pay
# for it at every call site. Where one is genuinely required by a signature contract — a
# Protocol stub, the uniform Gate shape, an ib_async callback — it carries a `noqa` naming
# the contract, so the exception is stated rather than assumed.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG"]

[tool.ruff.lint.isort]
# `tests` is importable (pythonpath = ["src", "."]) but is not under `src`, so without this
# isort files `from tests.support import ...` as third-party and sorts it above the package.
known-first-party = ["small_cap_stack", "tests"]

[tool.ruff.lint.per-file-ignores]
# ARG is about the package's own API being honest about what it depends on. Test doubles and
# spike harnesses exist precisely to satisfy a signature they don't use — a fake `fetch_day_bars`
# that ignores `trading_date` is the point, not a defect — so the rule would only buy `noqa`
# noise there. Scoped rather than relaxed: `src/` gets no exemption.
"tests/**" = ["ARG"]
"spikes/**" = ["ARG"]

[tool.mypy]
python_version = "3.11"
packages = ["small_cap_stack"]
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "ib_async.*",
    "duckdb.*",
    "yfinance.*",
    "prometheus_client.*",
    "exchange_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags are NOT here (#530). With `--cov-fail-under` in addopts, running one file
# (`pytest tests/test_gates.py`) printed a red "Required test coverage of 80% not reached.
# Total coverage: 4.77%" and exited 1 despite every test passing — which trains you to read
# past a failing pytest. They live in `make cov` / `make check` and in CI's main-only run
# instead, so a bare `pytest` is always usable and always means what it says.
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
# A warning is the only notice you get that a numeric dependency changed under you — a polars or
# duckdb deprecation is a change to how this system computes money. Erroring makes that a red CI
# run on the PR that bumps the dep, instead of a line nobody reads. Note the coupling to #546:
# with no lockfile, a floating dep can turn this red on an unrelated PR. When that happens the fix
# is a targeted `"ignore:<msg>:DeprecationWarning:<module>"` line here — not deleting the gate.
# `default::ResourceWarning` is deliberately NOT an error: `error` clears Python's default
# filters, and this suite does a lot of parquet/duckdb file I/O, so a handle reaped late by GC
# would fail an innocent test on GC timing — a flake class unrelated to the signal above.
# Note the blast radius of the rest: a dep that warns at IMPORT time aborts collection, so the
# whole suite reports 0 tests and no PR can merge until the ignore lands. Fix it promptly.
filterwarnings = ["error", "default::ResourceWarning"]

[tool.coverage.run]
source = ["small_cap_stack"]
branch = true
