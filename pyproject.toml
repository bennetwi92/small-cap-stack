[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "small-cap-stack"
version = "0.0.1"
description = "Automated systematic trading system for US small-cap momentum (Warrior-style), via IBKR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ib-async>=2.0.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pytz>=2024.2",
    "pandas>=2.2",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "duckdb>=1.1",
    "exchange-calendars>=4.10",
    "polars>=1.0",
    "pyarrow>=17",
    "yfinance>=0.2.40",
    "prometheus-client>=0.20",
]

[project.scripts]
small-cap-stack = "small_cap_stack.app:run_sync"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pandas-stubs",
    "types-pytz",
]

[tool.hatch.build.targets.wheel]
packages = ["src/small_cap_stack"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff 0.16 started formatting Python code blocks inside Markdown, which reflows the
# hand-aligned comment columns the `research/` specs use to stay readable (and turned
# `ruff format --check .` red on docs no CI job has any business rewriting). `ruff>=0.8`
# is unpinned, so this is opt-out, not a version pin: the formatter owns .py only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
packages = ["small_cap_stack"]
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "ib_async.*",
    "duckdb.*",
    "yfinance.*",
    "prometheus_client.*",
    "exchange_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags are NOT here (#530). With `--cov-fail-under` in addopts, running one file
# (`pytest tests/test_gates.py`) printed a red "Required test coverage of 80% not reached.
# Total coverage: 4.77%" and exited 1 despite every test passing — which trains you to read
# past a failing pytest. They live in `make cov` / `make check` and in CI's main-only run
# instead, so a bare `pytest` is always usable and always means what it says.
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
# A warning is the only notice you get that a numeric dependency changed under you — a polars or
# duckdb deprecation is a change to how this system computes money. Erroring makes that a red CI
# run on the PR that bumps the dep, instead of a line nobody reads. Note the coupling to #546:
# with no lockfile, a floating dep can turn this red on an unrelated PR. When that happens the fix
# is a targeted `"ignore:<msg>:DeprecationWarning:<module>"` line here — not deleting the gate.
# `default::ResourceWarning` is deliberately NOT an error: `error` clears Python's default
# filters, and this suite does a lot of parquet/duckdb file I/O, so a handle reaped late by GC
# would fail an innocent test on GC timing — a flake class unrelated to the signal above.
# Note the blast radius of the rest: a dep that warns at IMPORT time aborts collection, so the
# whole suite reports 0 tests and no PR can merge until the ignore lands. Fix it promptly.
filterwarnings = ["error", "default::ResourceWarning"]

[tool.coverage.run]
source = ["small_cap_stack"]
branch = true
