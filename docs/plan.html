<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>small-cap-stack · plan</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cockpit.css" />
  </head>
  <body>
    <!-- Cockpit chrome (#288): app bar + options bar render themselves; the status bar
         self-mounts at the bottom. Everything between is the plan board — a spine of three
         phases across the top, each carrying its own live counters, then three columns:
         collection progress, the Phase-1 checks, and the Phase-2 gate ladder.
         Every value on this page is computed at render time from the published data or
         from GitHub issue state (#414); nothing here is a hand-written status. Desktop
         never scrolls; each column owns its own overflow. -->
    <header id="appbar" class="appbar"></header>
    <div id="optbar"></div>
    <p id="pl-error" class="error" hidden></p>

    <main class="plan">
      <!-- the three phases, left to right; counters filled per phase from the data -->
      <section id="pl-spine" class="plan-spine"></section>

      <!-- column 1 — collection progress -->
      <div class="plan-col">
        <section class="panel plan-progress">
          <h2 class="panel-h">Phase 1 · collection</h2>
          <div class="plan-ring-row">
            <div id="pl-ring" class="plan-ring"></div>
            <div id="pl-ring-tiles" class="plan-ring-tiles"></div>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-h">Sessions collected</h2>
          <div id="pl-heat" class="plan-heat"></div>
          <p id="pl-heat-cap" class="plan-cap muted"></p>
        </section>

        <section class="panel plan-book">
          <h2 class="panel-h">Paper book</h2>
          <div id="pl-book" class="tiles"></div>
        </section>
      </div>

      <!-- column 2 — the Phase-1 checks, all derived from the published data -->
      <div class="plan-col">
        <section class="panel plan-checks-panel">
          <h2 class="panel-h">Phase 1 · checks</h2>
          <ul id="pl-checks" class="plan-checks"></ul>
          <!-- The one piece of prose the page keeps: where the prose went. -->
          <p class="plan-cap muted">
            The standing orders, and the reasoning behind each phase and gate:
            <a href="reports.html?r=2026-08-01-the-plan-and-what-the-projection-assumes"
              >The plan, and what the projection assumes</a
            >.
          </p>
        </section>
      </div>

      <!-- column 3 — what unlocks the next phase; status read from the issues -->
      <div class="plan-col">
        <section class="panel plan-gates-panel">
          <h2 class="panel-h">Phase 2 gates <span id="pl-gates-count" class="muted"></span></h2>
          <ol id="pl-gates" class="plan-gates"></ol>
          <p id="pl-gates-src" class="plan-cap muted"></p>
        </section>
      </div>
    </main>

    <script type="module" src="plan.js"></script>
  </body>
</html>
