name: CI

# Two runs per change, doing deliberately different jobs (#494/#495): the PR run is the merge gate
# and skips coverage, the main run is what makes "main is green" a measured statement rather than an
# inference and carries the 90% line+branch coverage gate (#530). Dropping the main run would leave
# no coverage gate anywhere; leaving coverage on PRs costs ~40% of the pytest step to re-measure a
# number that has sat above 93% for weeks and says nothing about the diff under review.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only reads the checkout. Fork PRs already get a read-only token, but
# stating it explicitly caps the blast radius on same-repo pushes too (#333).
permissions:
  contents: read

jobs:
  quality:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    # Bound the hang; GitHub's default is 360 minutes (#544). p95 1.3 min; 10x headroom for a cold uv cache or a slow runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # The `# v9.0.0` comment says `v9.0.0`, not `v9`: astral-sh stopped publishing floating major
      # tags after v7, so a bare `v9` fails the job at "Prepare all required actions" before a
      # single step runs. Since #547 the ref itself is the commit SHA — dependabot rewrites the SHA
      # and the comment together, so a manual bump means changing both and checking the tag exists.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # `uv`, not pip (#493): the dev dependency set is heavy (polars, pyarrow, duckdb, yfinance,
      # exchange-calendars, ib-async) and identical every run, so the old pip editable install
      # spent ~23 s of a 75 s job on resolution + wheel install. `setup-python`'s `cache: pip`
      # cached the downloads, not that work, so it goes too; `setup-uv`'s cache is the one that
      # applies now. Guarded by `test_ci_installs_from_the_lock`, which also forbids the old pip
      # string reappearing — so don't quote it in this comment.
      # `--frozen`: install exactly what `uv.lock` records and fail if the lock is stale, rather
      # than re-resolving here (#546). Before this, CI and the shipped image resolved independently
      # on different days, so two builds of the same commit could disagree on polars/duckdb — for
      # a system whose product is numbers, that made a difference between the box and a laptop
      # undiagnosable. `--all-extras` picks up `[dev]`; `--no-editable` is deliberate — the tests
      # should exercise the installed package, the way the image runs it.
      - name: Install
        run: uv sync --frozen --all-extras --no-editable

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (type-check)
        run: uv run mypy

      # PRs run the suite bare (~14 s off a 37 s step); the covered run happens on the push to
      # main, where the number describes the branch it is measuring (#494/#495). The flags are
      # spelled here rather than in pyproject's addopts so that a bare `pytest tests/one_file.py`
      # doesn't fail on coverage (#530) — `make cov` is the local mirror of this line.
      - name: Pytest
        run: uv run pytest ${{ github.event_name == 'push' && '--cov --cov-report=term-missing --cov-fail-under=90' || '' }}
