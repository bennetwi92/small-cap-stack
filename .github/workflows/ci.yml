name: CI

# Two runs per change, doing deliberately different jobs (#494/#495): the PR run is the merge gate
# and skips coverage, the main run is what makes "main is green" a measured statement rather than an
# inference and carries the 80% coverage gate. Dropping the main run would leave no coverage gate
# anywhere; leaving coverage on PRs costs ~40% of the pytest step to re-measure a number that has
# sat at 94% for weeks and says nothing about the diff under review.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only reads the checkout. Fork PRs already get a read-only token, but
# stating it explicitly caps the blast radius on same-repo pushes too (#333).
permissions:
  contents: read

jobs:
  quality:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # `@v9.0.0`, not `@v9`: astral-sh stopped publishing floating major tags after v7, so a bare
      # `v9` fails the job at "Prepare all required actions" before a single step runs. Bump this
      # to the exact release tag, and check the tag exists first.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `uv`, not pip (#493): the dev dependency set is heavy (polars, pyarrow, duckdb, yfinance,
      # exchange-calendars, ib-async) and identical every run, so the old pip editable install
      # spent ~23 s of a 75 s job on resolution + wheel install. `setup-python`'s `cache: pip`
      # cached the downloads, not that work, so it goes too; `setup-uv`'s cache is the one that
      # applies now. `--system` because there is no virtualenv here — uv must install into
      # `setup-python`'s interpreter or the bare `ruff` / `mypy` / `pytest` steps below won't
      # find the package. Guarded by `test_ci_installs_with_uv`, which also forbids the old
      # string reappearing — so don't quote it in this comment.
      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type-check)
        run: mypy

      # `--no-cov` on PRs (~14 s off a 37 s step); the covered run with `--cov-fail-under=80` from
      # pyproject's addopts happens on the push to main, where the number describes the branch it is
      # measuring. `make check` locally is unchanged — it always runs with coverage.
      - name: Pytest
        run: pytest ${{ github.event_name == 'pull_request' && '--no-cov' || '' }}
