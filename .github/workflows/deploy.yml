name: deploy

# Phone-triggerable deploy of the Phase-1 tracker to the Hetzner VM.
#
# Control-plane decision (research/decisions.md): GitHub drives deploys via a SELF-HOSTED runner
# registered on the VM. The runner polls GitHub *outbound*, so the box keeps NO inbound
# ports open and no SSH key ever lives in the ephemeral Claude Code container. Trigger from the
# phone with the GitHub UI / MCP "Run workflow" (workflow_dispatch).
#
# The runner: one self-hosted runner, `hetzner-vps`, labelled [self-hosted, vps] (#6, closed
# 2026-06-29). It has been live since then and this workflow deploys through it routinely — the
# header used to say "blocked on #6 … this workflow is inert", which was true for about a day.
#
# It executes ONE job at a time, which is worth knowing before reading the concurrency groups:
# jobs across workflows queue behind each other on the box rather than racing. `deploy/RUNBOOK.md`
# §11 covers what to do when it goes offline (busy).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy"
        required: false
        default: main
      image_tag:
        description: "Image tag to deploy (default: sha-<short> of ref). Rollback escape hatch for a commit with no image."
        required: false
        default: ""
      restart_only:
        description: "Restart the running service without pulling new code"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

# The GHCR image is public, so the deploy needs no packages token — only read for the sparse
# checkout of .github/actions (#333).
permissions:
  contents: read

jobs:
  deploy:
    name: deploy to vps
    # Repository guard: this box job must only ever run in THIS repo, never in a fork that
    # registered its own runner or re-used these files (#333, A1 lockdown).
    if: ${{ github.repository == 'bennetwi92/small-cap-stack' }}
    runs-on: [self-hosted, vps]
    # A hang holds the single vps runner and CI queues behind it (#544). p95 0.9 min; covers an image pull plus the health-gate wait.
    timeout-minutes: 25
    steps:
      # Composite actions resolve from the workspace, so the action directory must exist locally.
      # Sparse: these jobs otherwise never check out — they operate on /opt/small-cap-stack.
      - name: Check out the deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions

      - name: Deploy
        uses: ./.github/actions/deploy-app
        with:
          ref: ${{ inputs.ref }}
          image_tag: ${{ inputs.image_tag }}
          restart_only: ${{ inputs.restart_only }}
