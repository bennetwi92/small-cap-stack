name: publish-dashboard

# Publish the box's dashboard JSON (status.json / stats.json / charts/<date>.json — written by the app
# under /data/dashboard, issues #68/#113) to a single-commit orphan branch `dashboard-data` that
# the GitHub Pages frontend (#70) polls via raw.githubusercontent.com. The `docker cp .../.` below
# copies the whole dir, so any dashboard artifact the app writes is published without editing here.
#
# Runs on the SELF-HOSTED runner (on the box), so it reads the docker volume directly with
# `docker cp`. Outbound-only, uses GITHUB_TOKEN — no new secrets, no inbound ports (#69).
# Force-pushing a fresh single commit each run keeps the branch (and repo) from growing, and
# keeps dashboard data entirely off `main`.

on:
  schedule:
    - cron: "*/15 * * * *" # ~15-min freshness (GitHub's scheduled runs can lag under load)
  workflow_dispatch: {}

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: publish dashboard data
    # Repository guard: box job runs only in THIS repo, never a fork (#333, A1 lockdown).
    if: ${{ github.repository == 'bennetwi92/small-cap-stack' }}
    runs-on: [self-hosted, vps]
    # A hang holds the single vps runner and CI queues behind it (#544). p95 0.5 min; runs every 15 min, so it must never stack.
    timeout-minutes: 15
    steps:
      # Composite actions resolve from the workspace, so the action directory must exist locally.
      # Sparse: this job otherwise never checks out. ~1s on the box, where the workspace persists.
      - name: Check out the publish action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions

      # One composite action (#526): these 27 lines were BYTE-IDENTICAL in both callers, so a fix
      # to one silently missed the other — which is how #545's memory guard had to be applied to
      # the sibling backfill block twice.
      - name: Publish
        uses: ./.github/actions/publish-dashboard
