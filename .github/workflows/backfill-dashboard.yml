name: backfill-dashboard

# Phone-triggerable one-off: (re)generate the dashboard JSON (stats.json / dated
# charts/<date>.json + index.json) straight from the store in the app's docker volume. Use it for a
# single past trading date whose EOD ran on code that predated a dashboard feature (e.g. annotated
# charts #113) so its artifact is missing, or with `all: true` to backfill the whole archive at once
# so the review workbench's date picker is populated from day one (#141) — rather than waiting for
# the next 16:30 ET EOD.
#
# Runs on the SELF-HOSTED runner (on the box) so it can reach the data volume that holds the
# store. Pure store-read + projection — no IBKR, no live state — but NOT free: it runs in its own
# 1 GB container via `scripts/box-job.sh`, never inside the tracker's cgroup (#545).
# The existing `publish-dashboard` cron (*/15) then pushes the refreshed files to the
# `dashboard-data` branch; dispatch that workflow too if you want it live immediately.
#
# PREREQUISITE: the box must already be running code that contains
# `small_cap_stack.dashboard_backfill` — deploy the charts feature (deploy.yml) first.

on:
  workflow_dispatch:
    inputs:
      ignore_window:
        description: "Run even inside the tracker's 04:00-16:10 ET session window (contends for CPU)."
        type: boolean
        default: false
      date:
        description: "Trading date to rebuild (YYYY-MM-DD). Blank = yesterday (ET)."
        required: false
        default: ""
      all:
        description: "Full-archive: dated charts + index for EVERY collected date (#141). Overrides date."
        type: boolean
        required: false
        default: false
      force:
        description: "Required with 'all'. ⚠️ Full-archive rebuild has OOM-killed the box (#264)."
        type: boolean
        required: false
        default: false

concurrency:
  group: backfill-dashboard
  cancel-in-progress: false

# `contents: read` only, for the checkout that puts `scripts/box-job.sh` in the workspace
# (#545). The job reads the repo and nothing else — no packages, no issues, no id-token.
permissions:
  contents: read

jobs:
  backfill:
    name: regenerate dashboard JSON
    # Repository guard: box job runs only in THIS repo, never a fork (#333, A1 lockdown).
    if: ${{ github.repository == 'bennetwi92/small-cap-stack' }}
    runs-on: [self-hosted, vps]
    # A hang holds the single vps runner and CI queues behind it (#544). #264's OOM-killed run reached 13 min before the kernel took it.
    timeout-minutes: 30
    steps:
      # `scripts/box-job.sh` is a workspace path, and the self-hosted runner SHARES one
      # workspace across workflows — a prior sparse-checkout run can leave `scripts/` absent
      # or stale. `docker exec` needed nothing checked out; this does (#545).
      - name: Check out the job runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate the dashboard JSON
        # Dispatch inputs are read as runtime env vars, never interpolated into the script by the
        # Actions templater — so a crafted input can't inject shell (#333). (Owner-only today, but
        # cheap defense-in-depth, matching data-export.yml.)
        env:
          IN_ALL: ${{ inputs.all }}
          IN_FORCE: ${{ inputs.force }}
          IN_DATE: ${{ inputs.date }}
          # Empty unless explicitly requested, so the session-window guard in
          # scripts/box-job.sh holds by default (#545).
          BOX_JOB_IGNORE_WINDOW: ${{ inputs.ignore_window && '1' || '' }}
        run: |
          set -euo pipefail
          # An ARRAY, not a string (#548). Built as a string, this expanded unquoted — so the
          # value word-split AND glob-expanded: `date: "*"` became a directory listing, and a
          # stray space silently corrupted the date. Quoting the string would break the two-word
          # `--all --force` case; an array keeps each argument whole.
          #
          # It was NOT an argument-injection, though the first version of this comment said
          # so: `dashboard_backfill.py` puts the date and all flags in a mutually exclusive group,
          # so a date input carrying a second flag is rejected by argparse before the force guard
          # is even reached. Two CLI defences already covered that.
          args=()
          if [ "$IN_ALL" = "true" ]; then
            # A second, separate confirmation — the `all` toggle alone is not enough. --all rebuilds
            # every collected date in one process and has OOM-killed the box (#264), and this
            # workflow is the phone path that would actually do it. Auto-supplying --force here
            # would make the CLI guard theatre.
            if [ "$IN_FORCE" != "true" ]; then
              echo "Refusing --all without 'force'. It rebuilds every collected date in one" >&2
              echo "process and has OOM-killed the box (#264). Prefer a single 'date'." >&2
              echo "If you really mean the full archive, re-run with force: true." >&2
              exit 1
            fi
            args=(--all --force)
          elif [ -n "$IN_DATE" ]; then
            args=(--date "$IN_DATE")
          fi
          scripts/box-job.sh backfill -- -m small_cap_stack.dashboard_backfill ${args[@]+"${args[@]}"}
